
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FitLife Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              tg: {
                bg: 'var(--tg-theme-bg-color, #ffffff)',
                text: 'var(--tg-theme-text-color, #000000)',
                hint: 'var(--tg-theme-hint-color, #999999)',
                link: 'var(--tg-theme-link-color, #2481cc)',
                button: 'var(--tg-theme-button-color, #3b82f6)',
                buttonText: 'var(--tg-theme-button-text-color, #ffffff)',
                secondary: 'var(--tg-theme-secondary-bg-color, #f3f4f6)',
              },
              primary: '#3b82f6',
              slate: {
                850: '#1e293b',
              }
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
            }
          },
        },
      }
    </script>
    <style>
      /* Hide scrollbar for clean UI */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      body {
        background-color: var(--tg-theme-secondary-bg-color, #f3f4f6);
        color: var(--tg-theme-text-color, #1e293b);
        margin: 0;
        padding: 0;
      }
      /* Smooth transitions */
      .transition-all {
        transition-property: all;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }
      @keyframes bounce-in {
        0% { transform: translate(-50%, -20px); opacity: 0; }
        60% { transform: translate(-50%, 5px); opacity: 1; }
        100% { transform: translate(-50%, 0); opacity: 1; }
      }
      .animate-bounce-in {
        animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
    </style>

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
